<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockReport · 股票分析报告库</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --ink: #1f2329;
    --ink-2: #5c6470;
    --line: #e4e7ec;
    --up: #d43d3d;      /* 涨-红 */
    --down: #1a9c57;    /* 跌-绿 */
    --accent: #2f54eb;
    --accent-soft: #eef1fd;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    line-height: 1.6;
    padding: 48px 20px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header { margin-bottom: 36px; }
  header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  header h1 .dot { color: var(--up); }
  header p { color: var(--ink-2); font-size: 14px; margin-top: 6px; }
  header .meta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    font-size: 12px;
    color: var(--ink-2);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 14px;
  }
  .count-badge {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    border-radius: 999px;
    padding: 2px 10px;
    margin-left: 8px;
    vertical-align: 2px;
  }
  .cards { display: flex; flex-direction: column; gap: 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px 22px;
    display: flex;
    align-items: center;
    gap: 18px;
    transition: box-shadow .18s ease, transform .18s ease;
  }
  .card:hover {
    box-shadow: 0 6px 24px rgba(31, 35, 41, .08);
    transform: translateY(-2px);
  }
  .icon {
    flex: 0 0 46px;
    height: 46px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
  }
  .icon.hk { background: #2f54eb; }
  .icon.a { background: var(--up); }
  .body { flex: 1; min-width: 0; }
  .body .name {
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 11px;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 4px;
    background: #f0f1f4;
    color: var(--ink-2);
    border: 1px solid var(--line);
  }
  .tag.market-hk { background: var(--accent-soft); color: var(--accent); border-color: #d5ddfa; }
  .tag.market-a { background: #fdeeee; color: var(--up); border-color: #f6d3d3; }
  .tag.v2 { background: #eefaf1; color: var(--down); border-color: #cdeedb; }
  .side { flex: 0 0 auto; text-align: right; }
  .side .size { font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
  .btn {
    display: inline-block;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border-radius: 8px;
    padding: 8px 18px;
    transition: background .15s ease;
  }
  .btn:hover { background: #2440c0; }
  .note {
    margin-top: 36px;
    padding: 16px 20px;
    background: #fff8f0;
    border: 1px solid #f2e3c8;
    border-radius: 10px;
    font-size: 12px;
    color: #8a6d3b;
  }
  footer {
    margin-top: 28px;
    text-align: center;
    font-size: 12px;
    color: var(--ink-2);
  }
  footer code {
    background: #ececf0;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 11px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>StockReport<span class="dot">·</span>股票分析报告库</h1>
    <p>布林通道（BOLL 20,2）模型分析报告 · 离线单文件 HTML · git 版本管理</p>
    <div class="meta">
      <span>共 <b id="count">3</b> 份报告</span>
      <span>·</span>
      <span>最近更新 2026-09-01</span>
    </div>
  </header>

  <section class="cards" id="cards">
    <!-- 报告卡片由 JS 从数据源渲染 -->
  </section>

  <div class="note">
    <b>免责声明：</b>本库所有报告均为技术指标（布林通道/RSI/MFI 等）的统计与形态分析，不构成任何投资建议。市场有风险，决策需独立判断并自负盈亏。
  </div>

  <footer>
    报告库维护于 <code>/Users/jason/Documents/Workbuddy/StockReport</code>
    · 远程 <code>github.com/hilllinux/stockReport</code>
    · 首次提交 <code>6e416c0</code>
  </footer>
</div>

<script>
(function () {
  // 报告元数据（与 git 仓库内文件一一对应，新增报告时在此追加即可）
  var REPORTS = [
    {
      file: "腾讯控股_布林通道模型分析_2026-08-31.html",
      name: "腾讯控股（00700.HK）布林通道模型分析",
      market: "hk",
      marketLabel: "港股",
      version: "v1",
      date: "2026-08-31",
      sizeKB: 28.5,
      desc: "港股首份报告：中轨下方弱势震荡，关键位 458 / 424 / 492"
    },
    {
      file: "剑桥科技_布林通道模型分析_2026-09-01.html",
      name: "剑桥科技（603083.SH）布林通道模型分析",
      market: "a",
      marketLabel: "A股",
      version: "v1",
      date: "2026-09-01",
      sizeKB: 35.1,
      desc: "A股首份报告：上行通道内冲高回落，关键位 173.6 / 205 / 142"
    },
    {
      file: "剑桥科技_布林通道模型分析_2026-09-01_v2.html",
      name: "剑桥科技（603083.SH）布林通道模型分析 v2",
      market: "a",
      marketLabel: "A股",
      version: "v2",
      date: "2026-09-01",
      sizeKB: 120.0,
      desc: "方法论升级版：MFI/RSI 确认、%B 背离（M顶）、Squeeze、条件分布、双窗口分位、后复权存档"
    }
  ];

  var MARK = { hk: "港", a: "A" };
  var cards = document.getElementById("cards");
  REPORTS.forEach(function (r) {
    var card = document.createElement("a");
    card.href = r.file;
    card.className = "card";
    card.style.textDecoration = "none";
    card.style.color = "inherit";

    var icon = document.createElement("div");
    icon.className = "icon " + (r.market === "hk" ? "hk" : "a");
    icon.textContent = MARK[r.market];

    var body = document.createElement("div");
    body.className = "body";
    var name = document.createElement("div");
    name.className = "name";
    name.textContent = r.name;
    var tags = document.createElement("div");
    tags.className = "tags";
    [r.marketLabel, r.version, r.date].forEach(function (t) {
      var el = document.createElement("span");
      el.className = "tag";
      if (t === "港股") el.className += " market-hk";
      if (t === "A股") el.className += " market-a";
      if (t === "v2") el.className += " v2";
      el.textContent = t;
      tags.appendChild(el);
    });
    var desc = document.createElement("div");
    desc.style.cssText = "font-size:12px;color:#5c6470;margin-top:6px;";
    desc.textContent = r.desc;
    body.appendChild(name);
    body.appendChild(tags);
    body.appendChild(desc);

    var side = document.createElement("div");
    side.className = "side";
    var size = document.createElement("div");
    size.className = "size";
    size.textContent = r.sizeKB + " KB";
    var btn = document.createElement("span");
    btn.className = "btn";
    btn.textContent = "打开报告";
    side.appendChild(size);
    side.appendChild(btn);

    card.appendChild(icon);
    card.appendChild(body);
    card.appendChild(side);
    cards.appendChild(card);
  });

  document.getElementById("count").textContent = REPORTS.length;
})();
</script>
</body>
</html>
